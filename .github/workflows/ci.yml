name: CI

on:
  push:
    branches: [main]
  pull_request:

# TEMPLATE: Replace the placeholder job with ONE of the stack jobs below, then delete
# the rest. The placeholder fails on purpose: a template CI that shows green while
# testing nothing is worse than no CI, because you would trust it.
#
# Whatever the stack, CI runs the same three kinds of check as your local commands in
# CLAUDE.md: tests, types/warnings, and (optionally) formatting. Keep the versions here
# matched to what you run locally, to remove a whole class of "works on my machine".

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CI not configured yet: pick a stack job in .github/workflows/ci.yml"
          exit 1

