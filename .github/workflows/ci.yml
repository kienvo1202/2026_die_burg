name: CI

on:
  push:
    branches: [main]
  pull_request:

# The same commands as CLAUDE.md lists for local use, on the same Node version
# (.nvmrc), so "works on my machine" and "works in CI" mean the same thing.

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Node's own test runner with a glob: every *.test.ts is found, never one named file.
      - run: npm test
      # Types (TypeScript strict, including .astro files).
      - run: npm run check
      - run: npm run build
