- id: c1-1
  name: C1.1
  title: Nuance
  canDo: Express fine shades of meaning and catch what is only implied.
  lessons: []

- id: c1-2
  name: C1.2
  title: Fluency
  canDo: Speak and write fluently and precisely about complex subjects.
